<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- OLX Smart Helper — master icon (48 / 128 px and in-app logo).
       Deep Teal squircle, glowing Electric Cyan "S", price-sparkle accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00454c"/>
      <stop offset="0.55" stop-color="#002f34"/>
      <stop offset="1" stop-color="#001e22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffd5"/>
      <stop offset="1" stop-color="#23e5db"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#23e5db" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#23e5db" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#halo)"/>
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="#23e5db" stroke-opacity="0.32" stroke-width="2"/>

  <!-- S: two stacked elliptical arcs, centred on (64, 64) -->
  <path d="M81.3 41.5A20 15 0 1 0 64 64A20 15 0 1 1 46.7 86.5" fill="none"
        stroke="#23e5db" stroke-width="17" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M81.3 41.5A20 15 0 1 0 64 64A20 15 0 1 1 46.7 86.5" fill="none"
        stroke="url(#ink)" stroke-width="13" stroke-linecap="round"/>

  <!-- sparkle -->
  <path d="M100 16C101 23.5 103.5 26 111 27C103.5 28 101 30.5 100 38C99 30.5 96.5 28 89 27C96.5 26 99 23.5 100 16Z"
        fill="#00ffd5"/>
</svg>
