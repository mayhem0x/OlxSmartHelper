<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>OLX Smart Helper</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="brand-logo" src="../../icons/icon.svg" alt="" />
      <div>
        <div class="brand-name">OLX Smart Helper</div>
        <div class="brand-version"><span data-i18n="common.version">Версия</span> <span id="ver">—</span></div>
      </div>
    </div>
    <label class="lang">
      <span class="sr-only" data-i18n="lang.title"></span>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 0 1 5.08 16zm2.95-8H5.08a7.99 7.99 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
      <select id="lang" class="select" data-i18n-aria="lang.title"></select>
    </label>
  </header>

  <main>
    <section class="card">
      <div class="section-head">
        <h2 class="eyebrow" data-i18n="presets.title"></h2>
      </div>
      <div id="presets" class="list"></div>
      <div class="add-row">
        <input id="p-label" class="input" type="text" data-i18n-placeholder="presets.name" />
        <input id="p-text" class="input grow" type="text" data-i18n-placeholder="popup.text" />
        <button id="p-add" class="btn btn-primary square" type="button" data-i18n-title="popup.add" data-i18n-aria="popup.add">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>
    </section>

    <section class="card">
      <label class="switch">
        <input id="dbg" type="checkbox" />
        <span class="switch-track" aria-hidden="true"></span>
        <span class="switch-label" data-i18n="debug.toggle"></span>
      </label>
    </section>
  </main>

  <footer class="foot">
    <button id="more" class="btn btn-ghost" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
      <span data-i18n="popup.allSettings"></span>
    </button>
  </footer>

  <script src="../core/i18n.js"></script>
  <script src="../core/store.js"></script>
  <script src="../core/presets.js"></script>
  <script src="../shared/pages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
